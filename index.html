<script>


// ===== CHAT SUPABASE =====

const SUPABASE_URL = "https://cqxueguuqmyryttbppcb.supabase.co";

const SUPABASE_KEY = "sb_publishable_93n_d6h9xvNtVf73_UT0ZA_gW14NFX0";


async function loadPlan(){

let res = await fetch(
SUPABASE_URL + "/rest/v1/daily_plan?select=content",
{
headers:{
"apikey":SUPABASE_KEY
}
}
);

let data = await res.json();

console.log(data);

if(data[0]){
document.getElementById("plan").innerText = data[0].content;
}
else{
document.getElementById("plan").innerText="برنامه‌ای وجود ندارد";
}

}


loadPlan();

let currentUser = null;


async function signUp(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

if(!email || !password){
    alert("ایمیل و رمز را وارد کن");
    return;
}


let res = await fetch(
SUPABASE_URL + "/auth/v1/signup",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
email:email,
password:password
})

});


let data = await res.json();

console.log(data);


if(!data.user){

alert("ثبت نام نشد:\n"+JSON.stringify(data));
return;

}


alert("ثبت نام موفق شد ✅");


let sessionRes = await fetch(
SUPABASE_URL + "/auth/v1/token?grant_type=password",
{

method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
email:email,
password:password
})

});


let session = await sessionRes.json();


if(!session.access_token){

alert("Session ساخته نشد");
return;

}


// ساخت پروفایل

let profileRes = await fetch(
SUPABASE_URL + "/rest/v1/profile",
{

method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+session.access_token,
"Prefer":"return=representation"
},

body:JSON.stringify({

id:data.user.id,
email:email,
username:email.split("@")[0],
banned:false,
is_admin:false

})

});


let profile = await profileRes.text();

if(profileRes.ok){
    await signIn();
}


localStorage.setItem("token",session.access_token);


await signIn();

}



async function signIn(){

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;


let res = await fetch(
SUPABASE_URL + "/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
email:email,
password:password
})

});


let data = await res.json();


if(data.access_token){

localStorage.setItem("access_token",data.access_token);

let userRes = await fetch(
SUPABASE_URL + "/auth/v1/user",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + data.access_token
}
}
);

let user = await userRes.json();


let banRes = await fetch(
SUPABASE_URL +
"/rest/v1/profile?email=eq." +
encodeURIComponent(user.email) +
"&select=banned",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY
}
}
);


let banData = await banRes.json();


if(banData.length > 0 && banData[0].banned){

alert("⛔ این حساب توسط ادمین بن شده است.");

return;

}

let profileCheck = await fetch(
SUPABASE_URL +
"/rest/v1/profile?email=eq." +
encodeURIComponent(user.email) +
"&select=banned",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + data.access_token
}
}
);


let profileData = await profileCheck.json();


if(profileData.length > 0 && profileData[0].banned === true){

alert("⛔ حساب شما توسط ادمین بن شده است.");

return;

}

currentUser = user;

alert("ورود موفق شد ✅");

document.getElementById("message").disabled=false;
document.getElementById("sendBtn").disabled=false;

document.getElementById("loginStatus").innerHTML =
"✅ وارد شده: " + currentUser.email.split("@")[0];

document.getElementById("chat").innerHTML="";
loadMessages();

loadMessages();

}

else{

alert("ایمیل یا رمز اشتباه است");

}

}



function logout(){
    currentUser = null;
    localStorage.removeItem("token");
    location.reload();
}


async function loadMessages(){

if(!currentUser){
    document.getElementById("chat").innerHTML =
    "🔒 ابتدا وارد شوید";
    return;
}


let res = await fetch(
SUPABASE_URL + "/rest/v1/messages?select=*&order=id.asc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + localStorage.getItem("access_token")
}
}
);


let data = await res.json();

if(!Array.isArray(data)){
    console.log("خطای دریافت پیام:", data);
    return;
}

let chat = document.getElementById("chat");

chat.innerHTML="";


data.forEach(m=>{

chat.innerHTML += `

<div class="msg">

<div class="name"
style="${m.is_admin ? "color:#ff0000;font-weight:bold;" : ""}">

${m.is_admin ? "🛡️👑 " : ""}

${m.username}

${m.is_admin ? " 🔥 ADMIN" : ""}

</div>

${m.message}

<div class="time">
${new Date(m.created_at).toLocaleString("fa")}
</div>

</div>

`;

});


chat.scrollTop = chat.scrollHeight;

}



async function sendMessage(){

if(!currentUser){

alert("اول وارد شوید");

return;

}


let username =
currentUser.email.split("@")[0];


let message =
document.getElementById("message").value;


if(!message){
alert("پیام را وارد کن");
return;
}

await fetch(
SUPABASE_URL + "/rest/v1/messages",
{

method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + localStorage.getItem("access_token")
},

body:JSON.stringify({

username:username,

message:message

})

});


document.getElementById("message").value="";


loadMessages();

}



async function checkLogin(){

let token = localStorage.getItem("token");

if(!token){
return;
}


let res = await fetch(
SUPABASE_URL + "/auth/v1/user",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + token
}
}
);


}

function openProfile(){

document.getElementById("profilePage").style.display="block";

document.getElementById("profileName").innerHTML =
"نام کاربری: " + currentUser.email.split("@")[0];

}


function closeProfile(){

document.getElementById("profilePage").style.display="none";

}



async function changePassword(){

let oldPass =
document.getElementById("oldPassword").value;

let newPass =
document.getElementById("newPassword").value;


let email=currentUser.email;


// بررسی رمز قبلی
let login = await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},
body:JSON.stringify({
email:email,
password:oldPass
})
});


let loginData=await login.json();


if(!loginData.access_token){

document.getElementById("changeStatus").innerHTML=
"❌ رمز فعلی اشتباه است";

return;

}


// تغییر رمز

let update=await fetch(
SUPABASE_URL+"/auth/v1/user",
{
method:"PUT",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+loginData.access_token
},

body:JSON.stringify({
password:newPass
})

});


if(update.ok){

document.getElementById("changeStatus").innerHTML=
"✅ رمز با موفقیت تغییر کرد";

}

else{

document.getElementById("changeStatus").innerHTML=
"❌ خطا در تغییر رمز";

}

}

async function checkBanStatus(){

if(!currentUser) return;


let res = await fetch(
SUPABASE_URL +
"/rest/v1/profile?email=eq."+
encodeURIComponent(currentUser.email)+
"&select=banned",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+localStorage.getItem("access_token")
}
}
);


let data = await res.json();


if(data[0]?.banned === true){

alert("⛔ حساب شما بن شده است");

currentUser=null;

document.getElementById("message").disabled=true;
document.getElementById("sendBtn").disabled=true;

document.getElementById("loginStatus").innerHTML=
"⛔ حساب بن شده";

}

}

async function start(){

await checkLogin();

await loadMessages();

}

start();


setInterval(loadMessages,3000);

setInterval(checkBanStatus,5000);

</script>
